name: elpian_ui_example
description: Example app for the elpian_ui Flutter package.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.8
  elpian_ui:
    path: ../
  # The embedded Godot engine. Deliberately depended on HERE and not by
  # elpian_ui: the Godot library AAR is ~21 MB, and an app with no 3D
  # should not pay for it. Without this, Scene3D renders its placeholder.
  elpian_godot:
    path: ../godot

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/examples/
    - assets/scripts/
    # Populated by .github/workflows/build_showcase.yml from the
    # CLI's `showcase` template. Empty in a plain checkout.
    - assets/showcase/
