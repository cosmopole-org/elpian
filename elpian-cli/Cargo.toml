[package]
name = "elpian-cli"
version = "0.2.0"
edition = "2024"
description = "Native Rust project manager, TypeScript compiler, and development runner for Elpian"
license = "BSD-3-Clause"

[[bin]]
name = "elpian"
path = "rust/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
notify = "8.2"
oxc_allocator = "0.148"
oxc_ast = "0.148"
oxc_codegen = { version = "0.148", default-features = false }
oxc_parser = "0.148"
oxc_semantic = "0.148"
oxc_span = "0.148"
oxc_transformer = "0.148"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
js2elpian = { path = "../rust/js2elpian" }

[profile.release]
lto = "thin"
strip = true
