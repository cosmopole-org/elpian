name: elpian_godot
description: Embedded Godot 4 engine for Elpian's Scene3D widget (Android/iOS platform views + the op transport).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.elpian.godot
        pluginClass: ElpianGodotPlugin
      ios:
        pluginClass: ElpianGodotPlugin
