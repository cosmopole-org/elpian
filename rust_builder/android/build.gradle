// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.aspect.rust_lib_elpian_vm'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // noinspection DifferentKotlinGradleVersion
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Bumped from AGP default of 16.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.aspect.rust_lib_elpian_vm'
    }
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
    }

    sourceSets {
        main.jniLibs.srcDirs += "${buildDir}/jniLibs"
    }
}

// Build libelpian_vm.so for each Android ABI and stage it where the AGP picks
// up native libraries.
//
// This file previously contained no cargo invocation at all, so the Elpian VM
// was never built for Android: `DynamicLibrary.open('libelpian_vm.so')` failed
// at runtime, every VM operation degraded to a failed result, and the app
// rendered nothing with no indication why.
//
// cargo-ndk handles the NDK toolchain plumbing:
//
//     cargo install cargo-ndk
//     rustup target add aarch64-linux-android armv7-linux-androideabi \
//                       x86_64-linux-android i686-linux-android
ext {
    rustCrateDir = file("${projectDir}/../../rust/crates/elpian-ffi")
    rustManifest = new File(rustCrateDir, "Cargo.toml")
    // Matches Flutter's own default ABI set.
    androidAbis = ["arm64-v8a", "armeabi-v7a", "x86_64"]
}

tasks.register("buildElpianVm", Exec) {
    description = "Cross-compile the Elpian VM for every Android ABI."
    group = "build"

    def outDir = file("${buildDir}/jniLibs")
    outputs.dir(outDir)
    inputs.file(rustManifest)
    inputs.dir(file("${projectDir}/../../rust/crates/elpian-vm/src"))
    inputs.dir(file("${projectDir}/../../rust/crates/elpian-ffi/src"))

    doFirst { outDir.mkdirs() }

    // cargo-ndk runs `cargo metadata` in the process working directory before
    // it reads any of its own arguments, and it takes the shared target
    // directory from that. Gradle would otherwise run it here, in `android/`,
    // which has no Cargo.toml anywhere above it — so the build died with
    // "Failed to load Cargo.toml in current directory" even though the
    // manifest was named explicitly. Run from the crate instead.
    workingDir = rustCrateDir

    // No --manifest-path: from a working directory inside the workspace,
    // cargo-ndk derives the manifest itself and forwards its own
    // --manifest-path to cargo, and cargo rejects the flag twice.
    def args = ["cargo", "ndk", "-o", outDir.absolutePath]
    androidAbis.each { args += ["-t", it] }
    args += ["build", "--release"]
    commandLine args

    // A missing toolchain should say what to install rather than dumping a
    // gradle stack trace. cargo's own error is above this message, and is the
    // one to read first — this hint only covers the most common cause.
    ignoreExitValue = true
    doLast {
        if (executionResult.get().exitValue != 0) {
            throw new GradleException(
                "Could not build the Elpian VM for Android.\n" +
                "See the cargo output above. If the toolchain is missing:\n" +
                "  cargo install cargo-ndk\n" +
                "  rustup target add aarch64-linux-android " +
                "armv7-linux-androideabi x86_64-linux-android\n" +
                "and make sure ANDROID_NDK_HOME points at an installed NDK.")
        }
    }
}

tasks.configureEach { task ->
    if (task.name.startsWith("merge") && task.name.endsWith("NativeLibs")) {
        task.dependsOn("buildElpianVm")
    }
}
