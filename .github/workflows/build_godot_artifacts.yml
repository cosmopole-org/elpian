name: Build Godot artifacts

# Produces the three binary artifacts `elpian_godot` needs before Scene3D can
# render anything. They are NOT built by build_showcase.yml, because they change
# on a completely different cadence — only when Godot is bumped or the
# reflective interpreter changes — and rebuilding them on every push would add
# ~15 minutes for nothing.
#
#   1. The Godot library AAR      DOWNLOADED, never built. It is an unmodified
#                                 upstream release; building the engine from
#                                 source would take ~an hour to reproduce a
#                                 binary Godot already publishes.
#   2. The elpian_godot GDExtension  BUILT. Its source lives in
#                                 godot/extension and contains only the
#                                 VM-less ElpianScene3D op interpreter.
#   3. embed.pck                  BUILT. A headless export of
#                                 godot/godot-project/. Seconds.
#
# Two bundles are uploaded, one per target, and build_showcase.yml restores
# whichever its job needs:
#
#   godot-artifacts-android   the AAR + embed.pck + the per-ABI GDExtension
#   godot-artifacts-web       the Godot HTML5 export (wasm/pck/js) + the
#                             GDExtension built for wasm32, so Scene3D can be
#                             live on GitHub Pages rather than a placeholder
#
# When a bundle is absent that workflow still builds and ships the placeholder,
# so the graceful-degradation path stays exercised rather than rotting.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/extension/**"
      - "godot/godot-project/**"
      - ".github/workflows/build_godot_artifacts.yml"

permissions:
  contents: read

env:
  # Pinned together — godot-cpp, the editor and the export templates must all
  # match, or the .gdextension fails its compatibility check at load.
  GODOT_RELEASE: "4.3-stable"
  GODOT_TEMPLATE_DIR: "4.3.stable"
  GODOT_CPP_BRANCH: "godot-4.3-stable"
  # Godot 4.3's web templates are built with this emscripten; a mismatched
  # toolchain produces a side module the engine refuses to link at load.
  EMSDK_VERSION: "3.1.64"
  NDK_VERSION: "23.2.8568313"

jobs:
  android:
    name: Godot artifacts (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout elpian
        uses: actions/checkout@v4
        with:
          path: elpian

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"

      - name: Install scons
        run: pipx install scons || pip install scons

      # `git clone` into an existing path aborts with "could not create work
      # tree dir: File exists", so clear it first. Locally this path is a
      # checkout — often a symlink into a shared cache — and one such symlink,
      # pointing at an absolute developer path, was committed once and failed
      # every job here on checkout. .gitignore now covers it; this keeps the
      # clone from being what breaks if it ever comes back.
      - name: Clone godot-cpp
        run: |
          rm -rf elpian/godot/extension/godot-cpp
          git clone --depth 1 -b "$GODOT_CPP_BRANCH" \
            https://github.com/godotengine/godot-cpp \
            elpian/godot/extension/godot-cpp

      # godot-cpp is nearly all of the build time and only invalidates on a
      # Godot bump, so cache it on the pinned versions rather than the source.
      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            elpian/godot/extension/godot-cpp/bin
            elpian/godot/extension/godot-cpp/gen
            elpian/godot/extension/godot-cpp/src
            elpian/godot/extension/.sconsign.dblite
          key: godot-cpp-elpian-scene3d-${{ env.GODOT_CPP_BRANCH }}-${{ env.NDK_VERSION }}-v1

      # ---------------------------------------------------------------------
      # 2. The GDExtension.
      #
      # The in-repo extension contains only the VM-less Scene3D interpreter.
      # The Elpian VM stays in Flutter, so this native library has no Rust C-ABI
      # dependency and can be built directly for every Godot ABI.
      # ---------------------------------------------------------------------
      - name: Build the GDExtension for each Android ABI
        working-directory: elpian/godot/extension
        run: |
          set -e
          build() {
            scons platform=android target=template_release arch="$1"
          }
          build arm64
          build arm32
          build x86_64
          ls -la ../godot-project/bin/

      # The headless editor loads the .gdextension during import and export, so
      # a HOST library must exist too or the export aborts. Easy to miss: the
      # failure looks like a project error, not a missing build.
      - name: Build the GDExtension for the host platform
        working-directory: elpian/godot/extension
        run: scons platform=linux target=template_release

      # ---------------------------------------------------------------------
      # 1. The Godot library AAR + the editor, from the official release.
      # ---------------------------------------------------------------------
      - name: Install the Godot editor and export templates
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"

      # The AAR ships **prebuilt** inside android_source.zip, at
      # libs/release/godot-lib.template_release.aar. Unzip and copy; there is
      # nothing to build, which is the whole point of taking it from the
      # official templates.
      #
      # This step used to run `./gradlew :lib:assembleTemplateRelease` there and
      # could only ever fail — android_source.zip is Godot's Android *app*
      # template (a `com.android.application` root project whose settings.gradle
      # includes only `:assetPacks:installTime`), so there is no `:lib` module:
      #
      #   Cannot locate tasks that match ':lib:assembleTemplateRelease'
      #   as project 'lib' not found in root project 'godot-android'.
      - name: Take the Godot library AAR from the official templates
        run: |
          set -e
          mkdir -p /tmp/godot-android "$GITHUB_WORKSPACE/out/android/libs"
          unzip -o -q "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/android_source.zip" \
            -d /tmp/godot-android
          aar=/tmp/godot-android/libs/release/godot-lib.template_release.aar
          test -f "$aar" || { echo "::error::no prebuilt AAR in android_source.zip"; \
            find /tmp/godot-android -name '*.aar' -print; exit 1; }
          cp "$aar" "$GITHUB_WORKSPACE/out/android/libs/godot-lib.template_release.aar"
          ls -lh "$GITHUB_WORKSPACE/out/android/libs"

      # ---------------------------------------------------------------------
      # 3. embed.pck — the packed op-sink project.
      # ---------------------------------------------------------------------
      - name: Verify the extension libraries in the Godot project
        run: |
          for library in \
            libelpian_godot.android.arm64.so \
            libelpian_godot.android.arm32.so \
            libelpian_godot.android.x86_64.so \
            libelpian_godot.linux.x86_64.so; do
            test -f "elpian/godot/godot-project/bin/$library" \
              || { echo "::error::missing $library"; exit 1; }
          done
          ls -la elpian/godot/godot-project/bin

      - name: Export the op-sink project to embed.pck
        working-directory: elpian/godot/godot-project
        run: |
          set -e
          # A first headless open lets the editor import resources; the export
          # fails on a cold project otherwise.
          godot --headless --import || true
          # "pck" is the preset in export_presets.cfg built for exactly this
          # (Linux/X11, runnable=false, embed_pck=false). There is no "Android"
          # preset in that file, and Godot matches presets by exact name, so the
          # old spelling could only ever fail.
          godot --headless --export-pack "pck" "$GITHUB_WORKSPACE/out/embed.pck"
          ls -lh "$GITHUB_WORKSPACE/out/embed.pck"

      - name: Assemble the bundle
        run: |
          mkdir -p out/godot-project/bin
          cp elpian/godot/godot-project/bin/*.so out/godot-project/bin/
          cat > out/MANIFEST.txt <<EOF
          godot_release=${GODOT_RELEASE}
          godot_cpp=${GODOT_CPP_BRANCH}
          ndk=${NDK_VERSION}
          elpian=${GITHUB_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat out/MANIFEST.txt
          find out -type f -exec ls -lh {} \;

      - name: Upload the Godot artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot-artifacts-android
          path: out
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Web: a Godot HTML5 export of the same op-sink project.
  #
  # This is what makes Scene3D live on GitHub Pages. It is a separate job rather
  # than more steps on `android` because almost nothing is shared: a different
  # toolchain (emscripten, not the NDK), a different export preset, and a
  # different output shape (a wasm/pck/js export instead of an AAR plus a pck).
  #
  # GDExtension on the web needs the "extensions support" template variant —
  # already set in export_presets.cfg (`variant/extensions_support=true`) — and
  # the extension itself compiled to wasm32. Both halves must come from the same
  # emscripten, hence the pin above.
  # ---------------------------------------------------------------------------
  web:
    name: Godot artifacts (Web)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout elpian
        uses: actions/checkout@v4
        with:
          path: elpian

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Install scons
        run: pipx install scons || pip install scons

      # `git clone` into an existing path aborts with "could not create work
      # tree dir: File exists", so clear it first. Locally this path is a
      # checkout — often a symlink into a shared cache — and one such symlink,
      # pointing at an absolute developer path, was committed once and failed
      # every job here on checkout. .gitignore now covers it; this keeps the
      # clone from being what breaks if it ever comes back.
      - name: Clone godot-cpp
        run: |
          rm -rf elpian/godot/extension/godot-cpp
          git clone --depth 1 -b "$GODOT_CPP_BRANCH" \
            https://github.com/godotengine/godot-cpp \
            elpian/godot/extension/godot-cpp

      - name: Cache godot-cpp
        uses: actions/cache@v4
        with:
          path: |
            elpian/godot/extension/godot-cpp/bin
            elpian/godot/extension/godot-cpp/gen
            elpian/godot/extension/godot-cpp/src
            elpian/godot/extension/.sconsign.dblite
          key: godot-cpp-web-elpian-scene3d-nothreads-${{ env.GODOT_CPP_BRANCH }}-${{ env.EMSDK_VERSION }}-v1

      # `threads=no` matches the engine this extension has to load into.
      # export_presets.cfg sets `variant/thread_support=false`, so the export
      # uses Godot's web_dlink_nothreads template. A threaded side module cannot
      # load into that engine.
      - name: Build the GDExtension for the web
        working-directory: elpian/godot/extension
        run: |
          set -e
          scons platform=web target=template_release threads=no
          ls -la ../godot-project/bin/

          # A wasm function import can be resolved lazily by Emscripten, but a
          # tag import must be supplied as WebAssembly.Tag during instantiation.
          # Godot 4.3 has no __cpp_exception tag, so catch the exact ABI drift
          # which otherwise passes the build and leaves a blank canvas in Pages.
          node - ../godot-project/bin/libelpian_godot.web.wasm32.wasm <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const module = new WebAssembly.Module(fs.readFileSync(file));
          const bad = WebAssembly.Module.imports(module).filter(
            (entry) => entry.kind === 'tag'
              && entry.module === 'env'
              && entry.name === '__cpp_exception',
          );
          if (bad.length) {
            console.error('::error::GDExtension uses the wasm exception ABI, but Godot 4.3 expects the legacy Emscripten ABI');
            process.exit(1);
          }
          console.log('GDExtension exception ABI is compatible with Godot 4.3');
          NODE

      - name: Install the Godot editor and export templates
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/"
          # The extensions-support variant is a separate template in the archive;
          # without it the export silently drops the GDExtension and OpSink.gd
          # fails at _ready with "ElpianScene3D not loaded".
          ls "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR}/" | grep -i web

      # The .gdextension names the file it wants (web.wasm32 =
      # res://bin/libelpian_godot.web.wasm32.wasm). Assert it rather than trusting
      # the glob: an export whose library is missing still succeeds, and the
      # failure only shows up as a blank canvas at runtime.
      - name: Verify the extension library in the Godot project
        run: |
          set -e
          ls -la elpian/godot/godot-project/bin
          test -f elpian/godot/godot-project/bin/libelpian_godot.web.wasm32.wasm \
            || { echo "::error::GDExtension wasm missing; the export would ship without ElpianScene3D"; exit 1; }

      - name: Export the op-sink project for the web
        working-directory: elpian/godot/godot-project
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/out/godot"
          godot --headless --import || true
          godot --headless --export-release "Web" \
            "$GITHUB_WORKSPACE/out/godot/elpian_godot.html"
          ls -lh "$GITHUB_WORKSPACE/out/godot"
          # extensions_support=true + thread_support=false selects the
          # web_dlink_nothreads_release template, whose engine is split into
          # elpian_godot.wasm plus a side module. A missing side module loads as
          # a blank canvas, so fail here instead.
          for f in elpian_godot.js elpian_godot.wasm elpian_godot.pck elpian_godot.side.wasm; do
            test -f "$GITHUB_WORKSPACE/out/godot/$f" \
              || { echo "::error::web export is missing $f"; exit 1; }
          done

      # The page glue boots the engine itself instead of loading the exported
      # HTML shell, because the canvas has to be the one Flutter put in the
      # platform-view slot. It still needs the export's own config — the
      # executable/pack names, fileSizes, and the gdextensionLibs list all come
      # from the exporter and change with the Godot version — so lift it out of
      # the shell rather than hand-maintaining a copy.
      - name: Extract the engine config from the exported shell
        run: |
          python3 - <<'PY'
          import json, pathlib, re, sys
          html = pathlib.Path("out/godot/elpian_godot.html").read_text()
          m = re.search(r"const GODOT_CONFIG\s*=\s*(\{.*?\});", html, re.S)
          if not m:
              sys.exit("::error::GODOT_CONFIG not found in the exported shell")
          cfg = json.loads(m.group(1))
          # Owned by the page glue, not the export.
          for key in ("canvas", "canvasResizePolicy", "focusCanvas"):
              cfg.pop(key, None)
          pathlib.Path("out/godot/godot_config.json").write_text(json.dumps(cfg, indent=2))
          print(json.dumps(cfg, indent=2))
          if not cfg.get("gdextensionLibs"):
              sys.exit("::error::export declares no gdextensionLibs; ElpianScene3D would be absent")
          PY

      - name: Assemble the bundle
        run: |
          set -e
          # The shell is not shipped — the glue boots the engine — but keeping it
          # makes the export reproducible by hand when debugging.
          cat > out/MANIFEST.txt <<EOF
          target=web
          godot_release=${GODOT_RELEASE}
          godot_cpp=${GODOT_CPP_BRANCH}
          emsdk=${EMSDK_VERSION}
          elpian=${GITHUB_SHA}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF
          cat out/MANIFEST.txt
          find out -type f -exec ls -lh {} \;

      - name: Upload the Godot artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: godot-artifacts-web
          path: out
          retention-days: 90
