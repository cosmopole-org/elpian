name: Build Showcase (web + Android)

# Builds the mixed 2D + 3D showcase — an embedded Godot `Scene3D` stage
# surrounded by a rich Flutter GUI — for both targets.
#
# The app is NOT checked in: it is generated by `elpian create --template
# showcase`, so this workflow is also the standing proof that the CLI template,
# the TypeScript→bytecode toolchain and the Scene3D widget all still work
# together. If the template drifts from the runtime, this goes red.
#
# It also publishes the web build to GitHub Pages, replacing the old
# deploy_web_pages.yml, which published the example app.
#
# The two targets differ in one meaningful way:
#   * **web**   — no Godot artifact exists for the web yet, so `Scene3D` renders
#     its placeholder and the 2D app is fully live. This is the graceful
#     degradation path, built on every run so it cannot silently break.
#   * **Android** — the example app depends on the in-repo `elpian_godot`
#     plugin, so the APK carries the native embedded-Godot seam. A real engine
#     additionally needs three binary artifacts (see godot/README.md);
#     when they are absent the APK still builds and ships the same placeholder.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "rust/**"
      - "cli/**"
      - "godot/**"
      - ".github/workflows/build_showcase.yml"
  pull_request:
    paths:
      - "lib/**"
      - "cli/**"
      - ".github/workflows/build_showcase.yml"

permissions:
  contents: read
  actions: read   # to download the Godot bundle from build_godot_artifacts.yml
  pages: write    # the web job publishes the showcase to GitHub Pages
  id-token: write

# One Pages deployment at a time; supersede an in-flight run.
concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.38.3"

jobs:
  # ---------------------------------------------------------------------------
  # Generate the showcase app from the CLI template, then compile it to bytecode
  # and package the deployable web export. Shared by both platform jobs.
  # ---------------------------------------------------------------------------
  generate:
    name: Generate showcase from the CLI template
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout elpian
        uses: actions/checkout@v4
        with:
          path: elpian

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            elpian/cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('elpian/cli/Cargo.lock') }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the elpian CLI
        working-directory: elpian/cli
        run: cargo build --release --locked

      - name: Generate the showcase app
        run: |
          ./elpian/cli/target/release/elpian create showcase-app --template showcase
          ls -R showcase-app

      # basePath must match where the site is served, and it is baked into
      # index.html at build time — see the CLI's engine resolution.
      - name: Point the showcase at the Pages subpath
        working-directory: showcase-app
        run: |
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          cfg = json.load(open("elpian.config.json"))
          cfg["basePath"] = f"/{repo}/"
          json.dump(cfg, open("elpian.config.json", "w"), indent=2)
          print(cfg)
          PY

      - name: Install Elpian packages
        working-directory: showcase-app
        run: ../elpian/cli/target/release/elpian run install

      - name: Compile TypeScript to Elpian bytecode + package the web export
        working-directory: showcase-app
        run: ../elpian/cli/target/release/elpian run build --mode both

      - name: Assert the build produced what it should
        working-directory: showcase-app
        run: |
          set -e
          test -f dist/client.elpian.bc      || { echo "no client bytecode"; exit 1; }
          test -f dist/elpian.manifest.json  || { echo "no manifest"; exit 1; }
          test -f dist/web/index.html        || { echo "no web export"; exit 1; }
          test -d dist/web/__elpian          || { echo "no VM artifacts in the export"; exit 1; }
          # The showcase must actually contain a 3D stage — a template that
          # silently lost its Scene3D would otherwise still "build".
          grep -q "Scene3D" dist/client.elpian.js || { echo "showcase has no Scene3D"; exit 1; }
          echo "bytecode: $(stat -c%s dist/client.elpian.bc) bytes"

      - name: Upload the showcase app
        uses: actions/upload-artifact@v4
        with:
          name: showcase-app
          path: |
            showcase-app
            !showcase-app/.elpian
          retention-days: 7

      - name: Upload the deployable web export
        uses: actions/upload-artifact@v4
        with:
          name: showcase-web
          path: showcase-app/dist/web
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Web: the engine is a Flutter web build of the standalone client shell.
  # ---------------------------------------------------------------------------
  web:
    name: Build web engine
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout elpian
        uses: actions/checkout@v4
        with:
          path: elpian

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust (wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # The browser VM is a checked-in artifact; rebuild it so the showcase runs
      # the VM from this commit rather than whatever was last committed.
      - name: Build the Elpian VM for WebAssembly
        working-directory: elpian/rust
        run: |
          wasm-pack build --release --target web --out-name elpian_vm \
            --out-dir "$GITHUB_WORKSPACE/elpian/assets/web_runtime/wasm/elpian_vm"

      - name: Build the Flutter web engine shell
        working-directory: elpian/cli/elpian_client
        run: |
          flutter pub get
          flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Download the generated showcase
        uses: actions/download-artifact@v4
        with:
          name: showcase-app
          path: showcase-app

      # dist/web is the engine build plus the app's manifest and VM artifacts.
      - name: Assemble the deployable site
        run: |
          rm -rf site && cp -r elpian/cli/elpian_client/build/web site
          cp -r showcase-app/dist/web/__elpian site/__elpian
          test -f site/index.html
          test -f site/__elpian/elpian.manifest.json
          grep -o 'base href="[^"]*"' site/index.html
          du -sh site

      - name: Upload the site
        uses: actions/upload-artifact@v4
        with:
          name: showcase-site
          path: site
          retention-days: 14

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # ---------------------------------------------------------------------------
  # Publish the showcase to GitHub Pages. This replaces deploy_web_pages.yml,
  # which published the old example app — the showcase supersedes it, and
  # removing that workflow without this step would have taken the live site
  # down with it.
  #
  # Only from main: a pull request builds and uploads the site but must not
  # publish it.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Android: the example app, which hosts the showcase and the Scene3D widget.
  # ---------------------------------------------------------------------------
  android:
    name: Build Android APK
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout elpian
        uses: actions/checkout@v4
        with:
          path: elpian

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Rust (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # The three Godot binaries come from build_godot_artifacts.yml, which runs
      # on its own cadence (a Godot bump or an interpreter change) rather than on
      # every push here. `continue-on-error` is deliberate: when the bundle is
      # absent the APK still builds and ships the placeholder, so the
      # graceful-degradation path — what web and any un-provisioned build get —
      # stays exercised on every run instead of rotting.
      # Uses the preinstalled gh CLI rather than a third-party download action:
      # this step pulls a ~21 MB binary into the build, so it is worth keeping
      # the supply chain to first-party tooling.
      - name: Restore the Godot artifact bundle (optional)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow build_godot_artifacts.yml --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::notice::build_godot_artifacts.yml has no successful run yet."
            exit 0
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name godot-artifacts-android --dir godot-artifacts

      - name: Install the Godot artifacts into the plugin
        run: |
          set -e
          if [ ! -d godot-artifacts ]; then
            echo "::notice::No Godot artifact bundle — Scene3D will ship its placeholder."
            echo "GODOT_ENGINE_PRESENT=false" >> "$GITHUB_ENV"
            exit 0
          fi
          cat godot-artifacts/MANIFEST.txt || true
          mkdir -p elpian/godot/android/libs \
                   elpian/godot/android/src/main/assets/godot \
                   elpian/godot/godot-project/bin
          cp godot-artifacts/android/libs/godot-lib.template_release.aar \
             elpian/godot/android/libs/
          cp godot-artifacts/embed.pck \
             elpian/godot/android/src/main/assets/godot/embed.pck
          cp godot-artifacts/godot-project/bin/*.so \
             elpian/godot/godot-project/bin/ 2>/dev/null || true
          echo "GODOT_ENGINE_PRESENT=true" >> "$GITHUB_ENV"
          find elpian/godot -name "*.aar" -o -name "embed.pck" | xargs ls -lh

      - name: Download the generated showcase
        uses: actions/download-artifact@v4
        with:
          name: showcase-app
          path: showcase-app

      # Ship the compiled bytecode as an asset so the APK runs the very program
      # the CLI template generated, rather than a hand-maintained copy.
      - name: Bundle the showcase bytecode into the example app
        run: |
          mkdir -p elpian/example/assets/showcase
          cp showcase-app/dist/client.elpian.bc        elpian/example/assets/showcase/
          cp showcase-app/dist/elpian.manifest.json    elpian/example/assets/showcase/
          ls -l elpian/example/assets/showcase

      - name: Build the APK
        working-directory: elpian/example
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Assert the APK contains the showcase
        working-directory: elpian/example
        run: |
          set -e
          ls -lh build/app/outputs/flutter-apk/*.apk
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            unzip -l "$apk" | grep -q "assets/showcase/client.elpian.bc" \
              || { echo "$apk is missing the showcase bytecode"; exit 1; }
          done
          # When the bundle was restored the APK must actually carry the engine;
          # a silently-missing AAR would otherwise look like a successful build.
          if [ "${GODOT_ENGINE_PRESENT}" = "true" ]; then
            for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
              unzip -l "$apk" | grep -q "assets/godot/embed.pck" \
                || { echo "$apk was built with the engine but has no embed.pck"; exit 1; }
            done
            echo "APKs carry the embedded Godot engine."
          else
            echo "Built without the Godot engine — Scene3D ships its placeholder."
          fi

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: showcase-apk${{ env.GODOT_ENGINE_PRESENT == 'true' && '-with-godot' || '-placeholder' }}
          path: elpian/example/build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 14
