name: elpian_client
description: Minimal dynamic web client for applications served by the Elpian CLI.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  elpian_ui:
    path: ../..
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  # Drives tool/browser_smoke.dart, the headless-browser smoke check.
  puppeteer: ^3.0.0

flutter:
  uses-material-design: true
