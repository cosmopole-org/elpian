[package]
name = "elpian-vm"
version = "0.1.0"
edition = "2021"
description = "Elpian AST-based bytecode VM — a pure executor. Ingests Elpian AST JSON / bytecode (produced by front-end crates such as js2elpian / dart2elpian) and executes it, yielding host calls to the embedding runtime."

[workspace]
# The VM and its compiler front-ends, vendored from victor so this repository
# builds without a sibling checkout. The root package (elpian-vm) is implicitly
# a member; it stays at rust/ so rust_builder's CMake, the CLI's elpian-server
# manifest path and the wasm-pack working directory keep resolving.
members = ["js2elpian", "dart2elpian", "dart", "capi"]

# capi inherits these; carried over from victor's workspace so the vendored
# crates keep their original metadata.
[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

# Only the wasm-pack target uses the wasm-bindgen browser API (`api::wasm`).
# Matching bare `target_arch = "wasm32"` would also pull wasm-bindgen into the
# wasm32-unknown-emscripten build of the Godot GDExtension, which cannot use it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
