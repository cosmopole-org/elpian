[package]
name = "elpian-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Elpian mini-app host: runs an app's server-side function VMs, services their host calls, and governs what they may do."

[dependencies]
elpian-crypto = { path = "../elpian-crypto" }
elpian-vm = { path = "../elpian-vm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
