[package]
name = "elpian-pkg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Elpian package format: a deterministic, signed container carrying a mini app's client and server bytecode together."

[[bin]]
name = "elpian-pkg"
path = "src/bin/elpian-pkg.rs"

[dependencies]
elpian-crypto = { path = "../elpian-crypto" }
serde_json = "1.0"
