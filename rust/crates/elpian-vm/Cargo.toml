[package]
name = "elpian-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Elpian AST-based bytecode VM — a pure executor. Ingests Elpian AST JSON / bytecode (produced by front-end crates such as js2elpian / dart2elpian) and executes it, yielding host calls to the embedding runtime."

[lib]
# The embedding adapters own their platform artifacts: `elpian-ffi` produces
# the native library and `elpian-wasm` produces the browser cdylib. Keeping the
# executor itself an rlib prevents those outputs from colliding in a workspace
# build.
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
