[package]
name = "elpian-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Elpian AST-based bytecode VM — a pure executor. Ingests Elpian AST JSON / bytecode (produced by front-end crates such as js2elpian / dart2elpian) and executes it, yielding host calls to the embedding runtime."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

# Only the wasm-pack target uses the wasm-bindgen browser API (`api::wasm`).
# Matching bare `target_arch = "wasm32"` would also pull wasm-bindgen into the
# wasm32-unknown-emscripten build of the Godot GDExtension, which cannot use it.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = "0.2"
