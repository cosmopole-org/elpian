[package]
name = "elpian-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host-neutral multi-VM runtime for Elpian: a tree of governed VM instances sharing one host surface. Owns vm.spawn, the sandbox rules, aggregate budgets and per-VM callback namespacing; the embedder supplies the surface (Godot, Flutter, React Native, …) through the HostSurface trait."

[lib]
crate-type = ["rlib"]

[dependencies]
elpian-vm = { path = "../elpian-vm" }
elpian-dart-runtime = { path = "../elpian-dart-runtime", features = ["dart"] }
serde_json = "1.0"
