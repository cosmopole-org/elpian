[package]
name = "elpian-godot-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the Elpian VM's Dart runtime for embedding in the Godot GDExtension bridge. Exposes create/run/invoke/pump/free plus a host-callback seam so the C++ GodotController services the guest's godot.* askHost calls. No JIT anywhere: the VM stays a pausing bytecode interpreter."

[lib]
name = "elpian_godot"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
elpian-dart-runtime = { path = "../elpian-dart-runtime", features = ["dart"] }
elpian-vm = { path = "../elpian-vm" }
elpian-runtime = { path = "../elpian-runtime" }
serde_json = "1.0"

[dev-dependencies]
# The guest-SDK validity tests compile every prelude through the front-ends.
js2elpian = { path = "../js2elpian" }
dart2elpian = { path = "../dart2elpian" }
